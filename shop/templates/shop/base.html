{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.store_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="page-{{ nav }}" data-whatsapp="{{ site.whatsapp_number }}" data-store="{{ site.store_name }}" data-order-url="{% url 'api-order' %}" data-csrf="{{ csrf_token }}">

<nav class="navbar navbar-expand-md site-nav sticky-top">
  <div class="container">
    <a class="brand" href="{% url 'home' %}" aria-label="{{ site.store_name }} home"><span class="brand-word">{{ site.store_name }}</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Menu">
      <i class="bi bi-list fs-2"></i>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-md-4 me-auto">
        <li class="nav-item"><a class="nav-link{% if nav == 'home' %} active" aria-current="page{% endif %}" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link{% if nav == 'stationery' %} active" aria-current="page{% endif %}" href="{% url 'stationery' %}">Stationery</a></li>
        <li class="nav-item"><a class="nav-link{% if nav == 'fashion' %} active" aria-current="page{% endif %}" href="{% url 'fashion' %}">Fashion</a></li>
      </ul>
      <a class="btn btn-wa js-chat" href="#"><i class="bi bi-whatsapp"></i> Chat on WhatsApp</a>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="site-footer">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span class="brand-word brand-word-sm">{{ site.store_name }}</span>
    <a class="footer-phone js-chat" href="#"><i class="bi bi-telephone-fill"></i> {{ site.phone_display }}</a>
  </div>
</footer>

<a class="wa-fab js-chat" href="#" aria-label="Chat on WhatsApp"><i class="bi bi-whatsapp"></i></a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
